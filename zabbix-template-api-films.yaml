zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates/Applications
  templates:
    - uuid: a1b2c3d4e5f6478980123456789abcde
      template: 'API Films Node.js Monitoring'
      name: 'API Films Node.js Monitoring'
      description: 'Monitoramento da API REST de Filmes (Hono + PM2) na porta 8080'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 11111111222233334444555566667771
          name: 'API Films - HTTP Status (/health)'
          key: api.films.health.status
          delay: 30s
          history: 7d
          value_type: UNSIGNED
          description: 'Verifica se o endpoint http://localhost:8080/health responde com HTTP 200'
          triggers:
            - uuid: 99999999888877776666555544443331
              expression: 'last(/API Films Node.js Monitoring/api.films.health.status)<>200'
              name: 'API Films está fora do ar na VM2 (HTTP <> 200)'
              priority: HIGH
        - uuid: 11111111222233334444555566667772
          name: 'API Films - JSON Raw Health'
          key: api.films.health.json
          delay: 30s
          history: 1d
          trends: '0'
          value_type: TEXT
        - uuid: 11111111222233334444555566667773
          name: 'API Films - Uptime (segundos)'
          type: DEPENDENT
          key: api.films.uptime
          delay: '0'
          units: uptime
          master_item:
            key: api.films.health.json
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptime
        - uuid: 11111111222233334444555566667774
          name: 'API Films - Uso de Memória RSS (MB)'
          type: DEPENDENT
          key: api.films.memory.rss
          delay: '0'
          units: MB
          master_item:
            key: api.films.health.json
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory_rss_mb
          triggers:
            - uuid: 99999999888877776666555544443332
              expression: 'last(/API Films Node.js Monitoring/api.films.memory.rss)>512'
              name: 'API Films com alto consumo de memória (> 512MB)'
              priority: WARNING