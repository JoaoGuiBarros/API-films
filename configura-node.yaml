---
- name: Configurar VM2, implantar a API e instalar Zabbix Agent 2
  hosts: vm2
  become: yes
  tasks:
    - name: Atualizar cache do apt e instalar dependências do sistema
      apt:
        name:
          - git
          - curl
          - ca-certificates
          - wget
        state: present
        update_cache: yes

    - name: Baixar o script de setup do Node.js 20.x
      shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Instalar Node.js
      apt:
        name: nodejs
        state: present

    - name: Instalar PM2 globalmente para rodar a API em background
      npm:
        name: pm2
        global: yes

    - name: Clonar repositório da API como usuário vagrant
      become_user: vagrant
      git:
        repo: 'https://github.com/JoaoGuiBarros/API-films.git'
        dest: /home/vagrant/api-films
        version: main
        force: yes

    - name: Instalar dependências de execução (npm ci)
      become_user: vagrant
      command: npm ci --omit=dev
      args:
        chdir: /home/vagrant/api-films

    - name: Iniciar ou reiniciar a aplicação na porta 8080
      become_user: vagrant
      shell: pm2 describe api-films > /dev/null && pm2 restart api-films || pm2 start src/server.js --name api-films
      args:
        chdir: /home/vagrant/api-films

    - name: Salvar lista de processos do PM2
      become_user: vagrant
      command: pm2 save

    - name: Configurar PM2 para iniciar automaticamente no boot (systemd)
      shell: env PATH=$PATH:/usr/bin pm2 startup systemd -u vagrant --hp /home/vagrant
      args:
        creates: /etc/systemd/system/pm2-vagrant.service

    - name: Baixar repositório oficial do Zabbix 7.0 LTS (Ubuntu 22.04 Jammy)
      get_url:
        url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu22.04_all.deb
        dest: /tmp/zabbix-release.deb

    - name: Instalar pacote de repositório do Zabbix
      apt:
        deb: /tmp/zabbix-release.deb
        state: present

    - name: Instalar Zabbix Agent 2
      apt:
        name: zabbix-agent2
        state: present
        update_cache: yes

    - name: Configurar IP do Zabbix Server (Passivo) no zabbix_agent2.conf
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Server='
        line: "Server={{ zabbix_server_ip }}"

    - name: Configurar IP do Zabbix Server (Ativo) no zabbix_agent2.conf
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}"

    - name: Configurar Hostname no zabbix_agent2.conf
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Hostname='
        line: "Hostname={{ inventory_hostname }}"

    - name: Criar monitoramento customizado (UserParameter) para a API Films
      copy:
        dest: /etc/zabbix/zabbix_agent2.d/api_films.conf
        content: |
          # Retorna o código HTTP do endpoint /health (esperado: 200)
          UserParameter=api.films.health.status,curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo 0
          # Retorna o JSON completo do /health
          UserParameter=api.films.health.json,curl -s http://localhost:8080/health || echo '{"status":"DOWN"}'

    - name: Habilitar e reiniciar o serviço zabbix-agent2
      systemd:
        name: zabbix-agent2
        state: restarted
        enabled: yes

- name: Configurar Template, Host e Validar Coleta no Zabbix Server
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    zabbix_api_url: "http://192.168.56.10/api_jsonrpc.php"
    zabbix_user: "Admin"
    zabbix_password: "zabbix"
    template_path: "/vagrant/zabbix-template-api-films.yaml"

  tasks:
    - name: Aguardar interface web/API do Zabbix ficar disponível
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "apiinfo.version"
          params: []
          id: 0
      register: api_ready
      until: api_ready.status == 200
      retries: 36
      delay: 5

    - name: "[Passo 1] Autenticar na API do Zabbix 7.0"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "user.login"
          params:
            username: "{{ zabbix_user }}"
            password: "{{ zabbix_password }}"
          id: 1
      register: zabbix_login
      until: zabbix_login.json.result is defined
      retries: 12
      delay: 5

    - name: "[Passo 2] Importar template zabbix-template-api-films.yaml"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "configuration.import"
          params:
            format: "yaml"
            rules:
              templates:
                createMissing: true
                updateExisting: true
              template_groups:
                createMissing: true
              templateDashboards:
                createMissing: true
                updateExisting: true
                deleteMissing: true
              items:
                createMissing: true
                updateExisting: true
                deleteMissing: true
              triggers:
                createMissing: true
                updateExisting: true
                deleteMissing: true
            source: "{{ lookup('file', template_path) }}"
          id: 2

    - name: "[Passo 2.1] Buscar host padrão 'Zabbix server'"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.get"
          params:
            filter:
              host:
                - "Zabbix server"
          id: 21
      register: default_zabbix_host

    - name: "[Passo 2.2] Desativar monitoramento por agente no host padrão 'Zabbix server'"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ default_zabbix_host.json.result[0].hostid }}"
            status: 1
          id: 22
      when: default_zabbix_host.json.result | length > 0

    - name: "[Passo 3] Buscar ID do grupo 'Linux servers'"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "hostgroup.get"
          params:
            filter:
              name:
                - "Linux servers"
          id: 3
      register: zabbix_group

    - name: "[Passo 4] Buscar IDs dos templates no Zabbix"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "template.get"
          params:
            filter:
              host:
                - "API Films Node.js Monitoring"
                - "Linux by Zabbix agent"
          id: 4
      register: zabbix_templates

    - name: "[Passo 5] Formatar lista de templateids"
      set_fact:
        template_ids_list: "{{ (template_ids_list | default([])) + [{'templateid': item.templateid}] }}"
      loop: "{{ zabbix_templates.json.result }}"

    - name: "[Passo 6] Verificar se o host vm2 já está cadastrado"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.get"
          params:
            filter:
              host:
                - "vm2"
          id: 5
      register: zabbix_host_check

    - name: "[Passo 7] Criar host vm2 e vincular templates"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.create"
          params:
            host: "vm2"
            interfaces:
              - type: 1
                main: 1
                useip: 1
                ip: "192.168.56.11"
                dns: ""
                port: "10050"
            groups:
              - groupid: "{{ zabbix_group.json.result[0].groupid }}"
            templates: "{{ template_ids_list }}"
          id: 6
      when: zabbix_host_check.json.result | length == 0

    - name: "[Passo 8] Atualizar templates do host vm2 (caso já exista)"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zabbix_host_check.json.result[0].hostid }}"
            templates: "{{ template_ids_list }}"
          id: 7
      when: zabbix_host_check.json.result | length > 0

    - name: "[Passo 9] Obter ID do host vm2"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.get"
          params:
            filter:
              host:
                - "vm2"
          id: 8
      register: zabbix_host_final

    - name: "[Passo 10] Aguardar Zabbix coletar HTTP 200 da API Films (até 2 min)"
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "item.get"
          params:
            hostids: "{{ zabbix_host_final.json.result[0].hostid }}"
            filter:
              key_: "api.films.health.status"
          id: 9
      register: zabbix_item_status
      until:
        - zabbix_item_status.json.result | length > 0
        - zabbix_item_status.json.result[0].lastvalue == "200"
      retries: 12
      delay: 10

    - name: "[Passo 11] Confirmação final"
      debug:
        msg: "Monitoramento ativo! O Zabbix já está coletando métricas da VM2 (status HTTP = {{ zabbix_item_status.json.result[0].lastvalue }})."